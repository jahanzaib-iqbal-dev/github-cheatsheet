name: Daily Tip

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-tip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add next tip
        run: |
          DAY=$(cat progress.txt)
          NEXT=$((DAY + 1))

          if [ "$NEXT" -gt 365 ]; then
            echo "All 365 tips published!"
            exit 0
          fi

          python3 << 'EOF'
import json, re
from datetime import date

with open('progress.txt') as f:
    day = int(f.read().strip()) + 1

with open('tips.json') as f:
    tips = json.load(f)

tip = next(t for t in tips if t['day'] == day)

tip_block = f"### Day {tip['day']} — {tip['title']}\n`{tip['category']}` · {date.today().isoformat()}\n\n```bash\n{tip['command']}\n```\n\n> {tip['desc']}\n\n---\n"

with open('README.md') as f:
    content = f.read()

content = content.replace('<!-- TIPS_START -->\n', f'<!-- TIPS_START -->\n{tip_block}')
content = re.sub(r'tips-\d+%20%2F%20365', f'tips-{day}%20%2F%20365', content)

with open('README.md', 'w') as f:
    f.write(content)

with open('progress.txt', 'w') as f:
    f.write(str(day))

print(f"Added Day {day}: {tip['title']}")
EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DAY=$(cat progress.txt)
          TITLE=$(python3 -c "import json; tips=json.load(open('tips.json')); print(next(t for t in tips if t['day']==$DAY)['title'])")
          git add README.md progress.txt
          git commit -m "tip: day $DAY — $TITLE"
          git push
