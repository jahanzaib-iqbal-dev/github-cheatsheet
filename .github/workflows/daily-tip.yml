name: Daily Tip

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-tip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add next tip
        run: python3 add_tip.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DAY=$(cat progress.txt)
          TITLE=$(python3 -c "import json; tips=json.load(open('tips.json')); print(next(t for t in tips if t['day']==$DAY)['title'])")
          git add README.md progress.txt
          git commit -m "tip: day $DAY — $TITLE"
          git push
